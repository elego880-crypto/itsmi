  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;color:#ff4444;padding:20px;font-family:monospace;font-size:12px;z-index:99999;overflow:auto;white-space:pre-wrap';
      d.textContent = 'ERROR: ' + msg + '\n' + src + ':' + line + '\n\n' + (err ? err.stack : '');
      document.body.appendChild(d);
    };
    window.addEventListener('unhandledrejection', function(e) {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:#0a0a0a;color:#ff4444;padding:20px;font-family:monospace;font-size:12px;z-index:99999;overflow:auto;white-space:pre-wrap';
      d.textContent = 'PROMISE ERROR:\n' + (e.reason ? (e.reason.stack || String(e.reason)) : String(e));
      document.body.appendChild(d);
    });
  </script>
  <style>
    .hidden { display: none !important; }
